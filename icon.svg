<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="boxLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="boxRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="prog" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <!-- Isometric 3D Parcel -->
  <polygon points="256,92 404,166 256,240 108,166" fill="url(#boxTop)"/>
  <polygon points="108,166 256,240 256,372 108,298" fill="url(#boxLeft)"/>
  <polygon points="404,166 256,240 256,372 404,298" fill="url(#boxRight)"/>
  <!-- Package Tape -->
  <polygon points="196,122 344,196 312,212 164,138" fill="#fef3c7" opacity="0.88"/>
  <polygon points="312,212 344,196 344,244 312,260" fill="#fde68a" opacity="0.82"/>
  <!-- Progress Bar Pill at bottom -->
  <rect x="88" y="408" width="336" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <rect x="94" y="414" width="248" height="20" rx="10" fill="url(#prog)"/>
  <circle cx="342" cy="424" r="13" fill="#ffffff"/>
</svg>
